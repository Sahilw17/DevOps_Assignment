<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robot Explorer Bridge</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }
    .badge-online {
      background: #065f46;
      color: #34d399;
    }
    .badge-offline {
      background: #7f1d1d;
      color: #f87171;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }
    button:hover {
      background: #0369a1;
    }
    .saved-msg {
      font-size: 11px;
      color: #34d399;
      margin-top: 6px;
      text-align: center;
      display: none;
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>🤖 Robot Bridge</h2>
  
  <div class="status-card">
    <div class="status-row">
      <span style="color: #94a3b8;">Bridge Status:</span>
      <span id="conn-status" class="badge badge-offline">Offline</span>
    </div>
    <div class="status-row">
      <span style="color: #94a3b8;">Target Host:</span>
      <span id="target-mode" style="font-weight: 500;">Static Web App</span>
    </div>
  </div>

  <label for="server-url">Python Bridge WebSocket URL</label>
  <input type="text" id="server-url" value="ws://127.0.0.1:8765" placeholder="ws://127.0.0.1:8765" />
  
  <button id="save-btn">Save & Reconnect</button>
  <div id="saved-msg" class="saved-msg">✓ Settings saved & reconnected</div>

  <div class="footer">
    Proxie Studio DevOps Evaluation
  </div>

  <script src="popup.js"></script>
</body>
</html>
